# Alembic configuration for SUBSENSE backend
# The script_location and sqlalchemy.url are the two critical fields.

[alembic]
script_location = alembic
prepend_sys_path = .

# Use the DATABASE_URL env variable (set in .env).
# Alembic reads this via env.py — leave the placeholder here.
sqlalchemy.url = postgresql+psycopg2://subsense:subsense_dev@localhost:5432/subsense

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
